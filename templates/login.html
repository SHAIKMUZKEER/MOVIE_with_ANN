<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | MovieVerse</title>

    <link
        rel="stylesheet"
        href="/static/css/auth.css"
    >

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-icon">
                🎬
            </div>

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to rate movies and get recommendations.
            </p>


            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button
                    type="submit"
                >
                    Login
                </button>

            </form>


            <p
                id="loginMessage"
                class="message"
            ></p>


            <p class="switch">
                Don't have an account?

                <a href="/signup">
                    Create account
                </a>
            </p>

        </div>

    </div>


    <script src="/static/js/auth.js"></script>

</body>

</html>
