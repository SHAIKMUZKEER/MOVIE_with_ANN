<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MovieVerse</title>

    <link
        rel="stylesheet"
        href="/static/css/index.css"
    >

</head>

<body>

    <nav>

        <div class="logo">
            🎬 MovieVerse
        </div>

        <div>

            <a href="/login">
                Login
            </a>

            <a
                href="/signup"
                class="button"
            >
                Get Started
            </a>

        </div>

    </nav>


    <main>

        <div class="hero">

            <p>
                MOVIE RECOMMENDATION SYSTEM
            </p>

            <h1>
                Find.
                <span>Rate.</span>
                Discover.
            </h1>

            <p class="description">

                Explore movies, rate your favorites,
                and build your personal movie taste profile.

            </p>


            <div class="actions">

                <a
                    href="/movies"
                    class="primary"
                >
                    Explore Movies
                </a>

                <a
                    href="/signup"
                    class="secondary"
                >
                    Create Account
                </a>

            </div>

        </div>


        <div class="three-d">

            <div class="cube">

                <div>🎬</div>
                <div>⭐</div>
                <div>🎥</div>
                <div>🍿</div>
                <div>🎞️</div>
                <div>⭐</div>

            </div>

        </div>

    </main>

</body>

</html>
