<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Signup | MovieVerse</title>

    <link
        rel="stylesheet"
        href="/static/css/auth.css"
    >

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-icon">
                🎬
            </div>

            <h1>
                Create Account
            </h1>

            <p>
                Join MovieVerse and build your taste profile.
            </p>


            <form id="signupForm">

                <input
                    type="text"
                    id="user_name"
                    placeholder="Your name"
                    required
                >

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Password"
                    required
                >

                <button
                    type="submit"
                >
                    Create Account
                </button>

            </form>


            <p
                id="signupMessage"
                class="message"
            ></p>


            <p class="switch">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="/static/js/auth.js"></script>

</body>

</html>
